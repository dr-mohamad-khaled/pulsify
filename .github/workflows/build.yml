name: Build APK

on:
  push:
    branches: [v3, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Share the build log when the build fails
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong|Unresolved|> " build.log | head -200 > errors.txt || true
          tail -150 build.log > tail.txt
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rfq --cached . >/dev/null
          git add -f errors.txt tail.txt
          git commit -qm "build log ${{ github.run_number }}"
          git push -f origin ci-logs

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk pulsify-v3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pulsify-v3-apk
          path: pulsify-v3.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3-build-${{ github.run_number }}
          name: Pulsify v3 build ${{ github.run_number }}
          make_latest: true
          files: pulsify-v3.apk
          body: Pulsify v3 (Mochi + Kalboob). On your phone, download pulsify-v3.apk and open it to install.
