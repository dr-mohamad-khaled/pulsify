<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pulsify</title>
<meta name="theme-color" content="#07050B">
<meta name="description" content="Interactive AMOLED live wallpapers and 3D buddies that react to touch, music, time of day and charging.">

<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}html{overscroll-behavior:none}body{user-select:none;-webkit-user-select:none}</style>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: phone column — greeting, buddy hero, category chips, buddy shelf, live grid — then a full-bleed studio with one glass control sheet */
:root{
  --void:#000; --bg:#07050B; --surface:#14111C; --surface2:#1C1727; --glass:rgba(28,23,40,.62);
  --lav:#CDB4FF; --lav2:#B49BFF; --ink:#0D0A14; --violet:#9D4EDD; --amber:#FFB36B;
  --text:#FFFFFF; --muted:#9E96B0; --faint:#6E6880; --mintbg:#14271F; --mint:#4ADE80; --teal:#2DD4BF;
  --line:rgba(205,180,255,.12); --edge:rgba(157,78,221,.32);
  --f:"Plus Jakarta Sans",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
#home{height:100%;overflow-y:auto;background:radial-gradient(90% 40% at 85% -5%,rgba(157,78,221,.22),transparent 70%),radial-gradient(70% 30% at 0% 10%,rgba(255,179,107,.08),transparent 70%),var(--bg);scrollbar-width:none}
#home::-webkit-scrollbar{display:none}
.col{max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) 128px;display:flex;flex-direction:column;gap:22px}
.bar{display:flex;align-items:center;gap:10px}
.mark{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.01em}
.mark i{width:26px;height:26px;border-radius:9px;background:conic-gradient(from 210deg,var(--lav),var(--amber),var(--violet),var(--lav));box-shadow:0 0 18px rgba(205,180,255,.45);position:relative}
.mark i::after{content:"";position:absolute;inset:6px;border-radius:5px;background:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:var(--mintbg);color:var(--mint);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.chip.dim{background:var(--surface);color:var(--muted)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.chip.live .dot{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.sp{flex:1}
.greet h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.greet p{margin:6px 0 0;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.hero{position:relative;display:grid;grid-template-columns:40% 1fr;align-items:center;gap:6px;min-height:200px;border-radius:28px;padding:16px 18px 16px 6px;background:linear-gradient(150deg,#1E1730 0%,#110D19 60%);border:1px solid var(--edge);box-shadow:0 20px 50px -20px rgba(157,78,221,.45),inset 0 1px 0 rgba(255,179,107,.18);overflow:hidden;cursor:pointer}
.hero::before{content:"";position:absolute;left:-10%;top:10%;width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--hc,#3EE8FF) 0%,transparent 65%);opacity:.28;filter:blur(10px)}
.hero img{position:relative;width:100%;max-width:220px;justify-self:center;animation:float 4.5s ease-in-out infinite;filter:drop-shadow(0 18px 18px rgba(0,0,0,.55))}
@keyframes float{50%{transform:translateY(-8px) rotate(-1.5deg)}}
.hero .over{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.hero h2{margin:4px 0 2px;font-size:28px;font-weight:800;letter-spacing:-.02em}
.hero .mood{color:#D9D2EA;font-size:13.5px;display:flex;align-items:center;gap:6px}
.hero .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{height:38px;padding:0 14px;border-radius:999px;border:0;font:700 13.5px var(--f);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn.pri{background:var(--lav);color:var(--ink);box-shadow:0 0 22px rgba(205,180,255,.45)}
.btn.sec{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#EDE7FA}
.btn.big{height:52px;width:100%;justify-content:center;font-size:15px;border-radius:18px}
.tiles{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;height:38px;padding:0 14px 0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:7px;font:600 13px var(--f);color:#DDD6EC;transition:.2s}
.tile svg{color:var(--lav)}
.tile[aria-pressed="true"]{background:var(--lav);color:var(--ink);border-color:var(--lav);box-shadow:0 0 18px rgba(205,180,255,.45)}
.tile[aria-pressed="true"] svg{color:var(--ink)}
.sec{display:flex;align-items:baseline;justify-content:space-between}
.sec h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.sec span{font-size:12px;color:var(--muted)}
.shelf{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding:4px 18px 8px;scroll-snap-type:x proximity}
.shelf::-webkit-scrollbar{display:none}
.bcard{flex:none;width:132px;scroll-snap-align:start;border-radius:22px;padding:12px 10px 12px;background:linear-gradient(170deg,var(--surface2),#0E0B14);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;cursor:pointer;transition:transform .2s,border-color .2s}
.bcard:hover{transform:translateY(-2px);border-color:var(--edge)}
.bcard::before{content:"";position:absolute;top:18px;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 65%);opacity:.25}
.bcard img{position:relative;width:104px;height:104px;object-fit:contain;animation:float 5s ease-in-out infinite;animation-delay:var(--d,0s)}
.bcard b{font-size:14px}
.bcard small{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;border-radius:22px;overflow:hidden;background:#000;border:1px solid var(--line);aspect-ratio:3/4.3;cursor:pointer;transition:transform .25s,border-color .25s;max-width:100%}
.card:hover{transform:translateY(-2px);border-color:var(--edge)}
.card canvas,.card img.pv{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.card .info{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.88));display:flex;align-items:flex-end;gap:8px}
.card .txt{flex:1;min-width:0}
.card .over{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.card .ttl{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.go{flex:none;width:30px;height:30px;border-radius:50%;background:var(--lav);color:var(--ink);display:grid;place-items:center}
.kind{position:absolute;top:10px;left:10px;height:22px;padding:0 8px;font-size:9.5px}
.empty{grid-column:span 2;text-align:center;color:var(--muted);padding:36px 10px;border:1px dashed var(--line);border-radius:18px;font-size:14px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 36px));display:flex;justify-content:space-around;padding:7px;border-radius:24px;background:rgba(20,17,28,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);z-index:5}
.tab{border:0;background:none;color:var(--faint);min-width:72px;height:48px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 10.5px var(--f)}
.tab[aria-pressed="true"]{color:var(--lav);background:rgba(205,180,255,.08)}
/* studio */
#studio{position:fixed;inset:0;background:#000;z-index:10;overflow:hidden}
#stage,#studio canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage{touch-action:none}
#studio canvas.gl{pointer-events:none}
.top{position:absolute;z-index:3;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;pointer-events:none;transition:opacity .3s}
.top>*{pointer-events:auto}
.ib{flex:none;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;place-items:center;color:#fff}
.st{min-width:0;flex:1}
.st .over{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.st h1{margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 10px #000}
.sheet{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));background:rgba(20,17,28,.74);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--edge);box-shadow:0 -10px 40px -10px rgba(157,78,221,.3),inset 0 1px 0 rgba(255,179,107,.16);border-radius:26px;padding:12px;display:flex;flex-direction:column;gap:10px;transition:opacity .3s,transform .3s}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.scroll{overflow-x:auto;scrollbar-width:none;padding:2px}
.scroll::-webkit-scrollbar{display:none}
.pill{flex:none;height:34px;border:1px solid var(--line);background:var(--surface);color:#DDD6EC;font:600 12.5px var(--f);padding:0 13px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{background:var(--lav);color:var(--ink);border-color:var(--lav)}
.pill.acc{border-color:rgba(255,179,107,.4);color:var(--amber)}
.ab{flex:none;height:36px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:600 12.5px var(--f);color:#EDE7FA;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ab.on{background:var(--lav);color:var(--ink);border-color:var(--lav)}
.ab input{display:none}
#spec{flex:1;min-width:40px;height:36px;border-radius:10px;background:#0A0810;border:1px solid rgba(255,255,255,.04)}
.hint{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.4}
.vsep{flex:none;width:1px;height:22px;background:rgba(255,255,255,.1)}
#studio.bare .top,#studio.bare .sheet{opacity:0;pointer-events:none}
#studio.bare .sheet{transform:translate(-50%,24px)}
#showUI{position:absolute;z-index:4;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));opacity:.2}
#studio.wp .top,#studio.wp .sheet,#studio.wp #showUI{display:none!important}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--surface2);border:1px solid var(--edge);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;z-index:50;max-width:calc(100% - 32px);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.hero img,.bcard img{animation:none}}
@media (max-width:420px){.ab .t{display:none}.hero h2{font-size:24px}}
#studio:not([hidden]){animation:stIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes stIn{from{opacity:0;transform:scale(1.05)}}
#studio:not([hidden]) .sheet{animation:sheetIn .6s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheetIn{from{opacity:0;transform:translate(-50%,46px)}}
#studio:not([hidden]) .top{animation:fadeD .5s .1s both}
@keyframes fadeD{from{opacity:0;transform:translateY(-12px)}}
#home:not([hidden]) .col>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
#home .col>*:nth-child(2){animation-delay:.05s}#home .col>*:nth-child(3){animation-delay:.1s}#home .col>*:nth-child(4){animation-delay:.15s}#home .col>*:nth-child(5){animation-delay:.2s}#home .col>*:nth-child(6){animation-delay:.25s}#home .col>*:nth-child(7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.btn,.pill,.ab,.tile,.ib,.tab{transition:transform .15s,background .2s,color .2s}
.btn:active,.pill:active,.ab:active,.tile:active,.ib:active,.tab:active,.bcard:active,.card:active,.hero:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){#studio,.sheet,.top,#home .col>*{animation:none!important}}
</style>

  <div class="col">
    <div class="bar"><div class="mark"><i></i>Pulsify</div><span class="sp"></span><span class="chip dim" id="musicChip"><span class="dot"></span><span id="musicTxt">Music idle</span></span></div>

  <canvas id="stage"></canvas>

</div>

<script>
"use strict";

"use strict";
const TAU=Math.PI*2, rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
const SPR={};
function sprite(col){if(SPR[col])return SPR[col];const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.12,hexA(col,1));gr.addColorStop(.4,hexA(col,.35));gr.addColorStop(1,hexA(col,0));g.fillStyle=gr;g.fillRect(0,0,64,64);return SPR[col]=c}
function glow(ctx,col,x,y,s,a=1){ctx.globalAlpha=a;ctx.drawImage(sprite(col),x-s,y-s,s*2,s*2);ctx.globalAlpha=1}

/* ================= AUDIO ENGINE ================= */
const AE={ctx:null,an:null,master:null,fd:null,mode:'none',bass:0,mid:0,treble:0,level:0,beat:false,bpm:0,active:false,
  ema:0,last:0,iv:[],pk:[.2,.2,.2],raw:[0,0,0],el:null,elSrc:null,mic:null,beatPhase:0,
  init(){if(this.ctx)return;const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();
    this.an=this.ctx.createAnalyser();this.an.fftSize=2048;this.an.smoothingTimeConstant=.55;
    this.master=this.ctx.createGain();this.master.gain.value=.85;this.master.connect(this.ctx.destination);this.master.connect(this.an);
    const z=this.ctx.createGain();z.gain.value=0;this.an.connect(z);z.connect(this.ctx.destination);
    this.fd=new Uint8Array(this.an.frequencyBinCount)},
  band(lo,hi){const hz=this.ctx.sampleRate/this.an.fftSize;let a=Math.max(1,Math.floor(lo/hz)),b=Math.min(this.fd.length-1,Math.ceil(hi/hz)),s=0;for(let i=a;i<=b;i++)s+=this.fd[i];return s/((b-a+1)*255)},
  update(dt,now){
    this.beat=false;
    if(!this.ctx||this.mode==='none'){this.bass*=.9;this.mid*=.9;this.treble*=.9;this.level*=.9;this.active=false;if(this.fd)this.fd.fill(0);return}
    this.active=true;this.an.getByteFrequencyData(this.fd);
    const raw=[this.band(20,250),this.band(250,4000),this.band(4000,16000)];
    const k=Math.pow(.997,dt*60);
    const nb=raw.map((v,i)=>{this.pk[i]=Math.max(v,this.pk[i]*k,.06);return clamp(Math.pow(v/this.pk[i],1.6),0,1)});
    this.bass=lerp(this.bass,nb[0],.55);this.mid=lerp(this.mid,nb[1],.4);this.treble=lerp(this.treble,nb[2],.5);this.level=(this.bass+this.mid+this.treble)/3;
    const e=raw[0];
    if(e>this.ema*1.15&&nb[0]>.55&&now-this.last>.24){this.beat=true;const d=now-this.last;if(d<1.2){this.iv.push(d);if(this.iv.length>8)this.iv.shift()}this.last=now}
    this.ema=lerp(this.ema,e,.08);
    if(this.mode==='synth')this.bpm=SY.bpm;else if(this.iv.length>2){const s=[...this.iv].sort((a,b)=>a-b);this.bpm=clamp(60/s[s.length>>1],70,180)}else this.bpm=120;

/* ================= PHOTO SCENES (Flow stills + code lighting) ================= */
class PhotoScene extends Scene{
  constructor(pv,src,focus){super(pv);this.img=img(src);this.focus=focus||[.5,.5];this.zoom=1;this.iw=900;this.ih=1612;this.s=1;this.ox=0;this.oy=0}
  layout(){const w=this.w,h=this.h;if(ready(this.img)){this.iw=this.img.naturalWidth;this.ih=this.img.naturalHeight}const iw=this.iw,ih=this.ih;
    let s=(w/h>iw/ih*1.3)?h/ih*1.08:Math.max(w/iw,h/ih);s*=this.zoom;const dw=iw*s,dh=ih*s;let ox=w/2-this.focus[0]*dw,oy=h/2-this.focus[1]*dh;
    if(dw>=w)ox=clamp(ox,w-dw,0);else ox=(w-dw)/2;if(dh>=h)oy=clamp(oy,h-dh,0);else oy=(h-dh)/2;this.s=s;this.ox=ox;this.oy=oy;this.sc=dw/900}
  P(u,v){return[this.ox+u*this.iw*this.s,this.oy+v*this.ih*this.s]}
  inv(x,y){return[(x-this.ox)/(this.iw*this.s),(y-this.oy)/(this.ih*this.s)]}
  drawImg(ctx,dx=0,dy=0){if(!ready(this.img))return false;ctx.drawImage(this.img,this.ox+dx,this.oy+dy,this.iw*this.s,this.ih*this.s);return true}
}

/* ---- Solar Core: Flow sun photo + corona, prominences, flares ---- */

  constructor(pv){super(pv,'media/sun.jpg',[.5,.5]);this.rot=0;this.rv=0;this.proms=[]}
  layout(){super.layout();const d=.432*2*this.iw*this.s,m=Math.min(this.w,this.h)*.9;if(d>m){const k=m/d;this.s*=k;this.sc*=k;const dw=this.iw*this.s,dh=this.ih*this.s;this.ox=this.w/2-dw/2;this.oy=this.h*.47-dh*.499}}
  geom(){const[cx,cy]=this.P(.5,.499);return{cx,cy,R:.432*this.iw*this.s}}
  flare(ang,pw){const{cx,cy,R}=this.geom(),x=cx+Math.cos(ang)*R,y=cy+Math.sin(ang)*R,cols=['#FFBE0B','#FB5607','#E0115F','#FFE29A'];
    for(let i=0;i<(this.preview?25:120)*pw;i++){const a=ang+rnd(-.35,.35),s=rnd(60,440)*pw*(this.preview?.5:1),l=rnd(1,2.4);this.parts.add({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:l,max:l,size:rnd(1.2,3.6),col:cols[(Math.random()*4)|0],drag:.975})}
    this.proms.push({a:ang,life:2.4,max:2.4,h:R*rnd(.08,.2)})}
  down(p){p.sx=p.x;p.sy=p.y;p.lx=p.x;p.ly=p.y;const{cx,cy,R}=this.geom();if(Math.hypot(p.x-cx,p.y-cy)<R*1.1)this.flare(Math.atan2(p.y-cy,p.x-cx),1.2)}
  move(p){this.rv+=(p.x-p.lx)*.0012;p.lx=p.x;p.ly=p.y}
  update(dt,A){this.t+=dt;this.A=A;this.rot+=(.006+this.rv)*dt*6;this.rv*=Math.pow(.15,dt);
    if(A.beat)this.flare(rnd(TAU),.55+A.bass*.6);
    if(Math.random()<dt*(3+(A.active?A.treble*10:0))){const{cx,cy,R}=this.geom(),a=rnd(TAU);this.parts.add({x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R,vx:Math.cos(a)*rnd(10,50),vy:Math.sin(a)*rnd(10,50),life:2,max:2,size:rnd(1,2.4),col:Math.random()<.5?'#FB5607':'#FFBE0B',drag:.99})}

    ctx.globalCompositeOperation='lighter';const cr=R*(1.5+bass*.6);let g=ctx.createRadialGradient(cx,cy,R*.92,cx,cy,cr);g.addColorStop(0,'rgba(255,170,30,.5)');g.addColorStop(.3,'rgba(251,86,7,.18)');g.addColorStop(.7,'rgba(200,20,60,.05)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(cx-cr,cy-cr,cr*2,cr*2);
    ctx.save();ctx.translate(cx,cy);for(let i=0;i<30;i++){const a=i/30*TAU+this.t*.03,l=R*(1.1+.5*vnoise(i*1.7,this.t*.7,0)+(A.active?A.treble*.35:0));ctx.fillStyle='rgba(255,160,40,.06)';ctx.beginPath();ctx.moveTo(Math.cos(a-.04)*R,Math.sin(a-.04)*R);ctx.lineTo(Math.cos(a)*l,Math.sin(a)*l);ctx.lineTo(Math.cos(a+.04)*R,Math.sin(a+.04)*R);ctx.fill()}ctx.restore();

    ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';for(const pr of this.proms){const k=1-pr.life/pr.max,gr=Math.sin(Math.min(1,k*1.6)*Math.PI/2),fade=Math.min(1,pr.life/.8)*Math.min(1,k*4),a0=pr.a-.06,a1=pr.a+.06,h=R+pr.h*gr*2.2;

    this.parts.draw(ctx)}

$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;AE.stopAll();AE.init();AE.ctx.resume();if(!AE.el){AE.el=new Audio();AE.el.loop=true;AE.elSrc=AE.ctx.createMediaElementSource(AE.el);AE.elSrc.connect(AE.master)}
  if(AE.el.src)URL.revokeObjectURL(AE.el.src);AE.el.src=URL.createObjectURL(f);AE.el.play().then(()=>{AE.mode='file';audioUI();toast('Playing '+f.name)}).catch(()=>toast('That file could not be played. Try an MP3, M4A, WAV or OGG.'));e.target.value=''};
const spec=$('#spec'),spx=spec.getContext('2d');
function drawSpec(){const r=spec.getBoundingClientRect();if(!r.width)return;const W=Math.round(r.width*dpr),H=Math.round(r.height*dpr);if(spec.width!==W||spec.height!==H){spec.width=W;spec.height=H}
  spx.clearRect(0,0,W,H);const n=Math.max(12,Math.floor(r.width/7)),bw=W/n,fd=AE.fd,g=spx.createLinearGradient(0,H,0,0);g.addColorStop(0,'#9D4EDD');g.addColorStop(.6,'#CDB4FF');g.addColorStop(1,'#FFB36B');spx.fillStyle=g;
  for(let i=0;i<n;i++){let v=0;if(fd&&AE.active){const L=fd.length*.75,a=Math.floor(Math.pow(L,i/n)),b=Math.max(a+1,Math.floor(Math.pow(L,(i+1)/n)));for(let k=a;k<b&&k<fd.length;k++)v=Math.max(v,fd[k]);v/=255}else v=.04+.03*Math.sin(performance.now()/400+i*.5);
    const h=Math.max(2*dpr,v*(H-4*dpr));spx.globalAlpha=.55+v*.45;spx.fillRect(i*bw+dpr,H-2*dpr-h,bw-2*dpr,h)}spx.globalAlpha=1}

/* ---------- live wallpaper mode (inside the Android WallpaperService) ---------- */
let wpCfg=null,lastOff=null,offT=0,lastUnlocks=0,lastOffs=0,wasVisible=true;
function wpConfig(){let c={};try{c=JSON.parse(HOST.config()||'{}')}catch(e){}return c}
function wpOpen(c){wpCfg=c;const id=c.id&&CATALOG.find(x=>x.id===c.id)?c.id:'b_pip';openStudio(id);$('#studio').classList.add('bare','wp');if(scene.isBuddy&&c.buddy&&BUDS[c.buddy])scene.setBuddy(c.buddy,true);if(c.variant&&scene.setVariant&&!scene.isBuddy)scene.setVariant(c.variant);if(scene instanceof SuperScene){scene.noClock=true}}
function wpTick(dt){if(HSTATE.visible&&!wasVisible){const c=wpConfig();if(JSON.stringify(c)!==JSON.stringify(wpCfg))wpOpen(c)}wasVisible=HSTATE.visible;
  if(HSTATE.screenOffs!==lastOffs){lastOffs=HSTATE.screenOffs;if(scene instanceof SuperScene)scene.setVariant('Lock screen');if(scene&&scene.isBuddy&&wpCfg&&wpCfg.shuffle)scene.shuffle()}
  if(HSTATE.unlocks!==lastUnlocks){lastUnlocks=HSTATE.unlocks;if(scene instanceof SuperScene)scene.unlock();if(scene&&scene.isBuddy){scene.wakeUp();scene.b.act=.8;scene.say(dayPhase()==='morning'?'☀':'♥')}}
  // home-screen page swipes arrive as wallpaper offsets
  const o=HSTATE.offset;if(lastOff==null)lastOff=o;offT-=dt;if(Math.abs(o-lastOff)>.08&&offT<=0&&scene&&scene.swipe){scene.swipe(o>lastOff?1:-1);offT=.7;lastOff=o}if(offT<=0)lastOff=lerp(lastOff,o,.3)}

/* ---------- main loop ---------- */
let last=performance.now(),poll=0,homeT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;dtFrame=dt;const t=now/1000;if(HOST&&(poll^=1))pollHost();
  if(WP&&!HSTATE.visible){requestAnimationFrame(frame);return}
  AE.update(dt,t);if(WP)wpTick(dt);
  if(view==='studio'&&scene){const w=innerWidth,h=innerHeight;scene.update(dt,AE);sctx.setTransform(dpr,0,0,dpr,0,0);sctx.globalAlpha=1;sctx.globalCompositeOperation='source-over';sctx.fillStyle='#000';sctx.fillRect(0,0,w,h);scene.draw(sctx);
    if(!WP){drawSpec();if(scene.isBuddy){const mc=$('#moodChip'),txt=MOOD_TEXT[scene.mood]||'';if(mc.textContent!==txt)mc.textContent=txt}if((homeT+=dt)>.5){homeT=0;audioUI()}}}
  else if(view==='home'){const A=AE.active?AE:fakeA(t);if((homeT+=dt)>1){homeT=0;homeText()}
    for(const k in previews){const P=previews[k];if(P.el.hidden)continue;P.acc+=dt;if(P.acc<1/24)continue;const pdt=Math.min(.08,P.acc);P.acc=0;const r=P.el.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)continue;const w=Math.round(r.width),h=Math.round(r.height);if(!w||!h)continue;
      if(!P.sc)P.sc=P.it.make(true);if(w!==P.w||h!==P.h){P.w=w;P.h=h;P.cv.width=w;P.cv.height=h;P.sc.resize(w,h)}P.sc.update(pdt,A);P.ctx.setTransform(1,0,0,1,0,0);P.ctx.globalAlpha=1;P.ctx.globalCompositeOperation='source-over';P.ctx.fillStyle='#000';P.ctx.fillRect(0,0,w,h);P.sc.draw(P.ctx)}}
  requestAnimationFrame(frame)}
if(WP){$('#home').hidden=true;pollHost();lastUnlocks=HSTATE.unlocks;lastOffs=HSTATE.screenOffs;wpOpen(wpConfig())}
else{setHero();setTimeout(()=>{buddyThumbs();setHero();document.querySelectorAll('.bcard').forEach(el=>{el.querySelector('img').src=THUMBS[el.dataset.id]||''})},60)}
audioUI();requestAnimationFrame(frame);

</script>
<script>if('serviceWorker'in navigator&&!window.PulsifyHost)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
