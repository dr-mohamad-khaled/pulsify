<title>Pulsify</title>

<meta name="description" content="Interactive AMOLED live wallpapers that react to touch and music.">

<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}#home .col{padding-top:calc(18px + env(safe-area-inset-top,0px))}html{overscroll-behavior:none}body{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}</style>

<style>
/* Layout: phone-column discover (category tiles, featured carousel, live grid) -> full-bleed AMOLED studio with glass dock */
:root{
  --bg:#08060C; --surface:#15121E; --surface2:#1E192B; --glass:rgba(30,25,43,.65);
  --lav:#CDB4FF; --ink:#0D0A14; --violet:#9D4EDD; --amber:#FFB36B;
  --text:#FFFFFF; --muted:#9E96B0; --mintbg:#1A2E2B; --mint:#4ADE80; --teal:#2DD4BF;
  --line:rgba(157,78,221,.3);
  --f:"Plus Jakarta Sans",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within,[role=button]:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
#home{height:100%;overflow-y:auto;background:radial-gradient(120% 50% at 50% -10%,#1b1328 0%,var(--bg) 60%)}
.col{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:34px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(95deg,#fff 0%,var(--lav) 55%,var(--amber) 120%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(205,180,255,.4))}
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--mintbg);color:var(--mint);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:6px 11px;border-radius:999px;white-space:nowrap}
.badge.teal{color:var(--teal)}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.search{display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(205,180,255,.16);border-radius:14px;padding:12px 14px}
.search svg{flex:none;color:var(--lav)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:500 15px var(--f)}
.search input::placeholder{color:var(--muted)}
.tiles{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:4px}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:92px;height:92px;border-radius:18px;border:1px solid rgba(157,78,221,.4);background:linear-gradient(160deg,var(--surface2),var(--surface));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font:600 11.5px/1.15 var(--f);text-align:center;color:#e6e0f2;padding:6px;transition:.2s;box-shadow:inset 0 1px 0 rgba(255,179,107,.12)}
.tile svg{color:var(--lav)}
.tile:hover{border-color:var(--lav)}
.tile[aria-pressed="true"]{background:linear-gradient(160deg,var(--lav),#a98bff);color:var(--ink);border-color:var(--lav);box-shadow:0 0 22px rgba(205,180,255,.5)}
.tile[aria-pressed="true"] svg{color:var(--ink)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.sec h2{margin:0;font-size:17px;font-weight:700}
.sec span{font-size:12px;color:var(--muted)}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-4px;padding:4px}
.carousel::-webkit-scrollbar{display:none}
.feat{position:relative;flex:none;width:78%;max-width:400px;aspect-ratio:3/4.1;border-radius:26px;overflow:hidden;scroll-snap-align:center;border:1px solid var(--line);box-shadow:0 0 30px rgba(157,78,221,.22),inset 0 1px 0 rgba(255,179,107,.2);background:#000;cursor:pointer}
.feat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.feat img{animation:none}}
.feat .shade{position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.92))}
.feat .meta{position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:flex-end;gap:12px}
.feat .meta .t{flex:1;min-width:0}
.feat h3{margin:4px 0 6px;font-size:21px;font-weight:800;letter-spacing:-.01em}
.chip{display:inline-block;font-size:11px;font-weight:600;color:#e6e0f2;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 10px;background:rgba(13,10,20,.45);backdrop-filter:blur(8px)}
.apply{flex:none;border:0;border-radius:999px;padding:12px 20px;font:800 14px var(--f);letter-spacing:.06em;color:var(--ink);background:var(--lav);box-shadow:0 0 22px rgba(205,180,255,.6)}
.over{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;border-radius:22px;overflow:hidden;background:#000;border:1px solid var(--line);box-shadow:0 0 24px rgba(157,78,221,.14),inset 0 1px 0 rgba(255,179,107,.14);aspect-ratio:3/4.4;cursor:pointer;transition:transform .25s,box-shadow .25s;max-width:100%}
.card:hover{transform:translateY(-2px);box-shadow:0 0 34px rgba(157,78,221,.32)}
.card canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.card .info{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:8px;padding:9px 9px 9px 11px;border-radius:16px;background:rgba(21,18,30,.62);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06)}
.info .txt{flex:1;min-width:0}
.ttl{font-size:14px;font-weight:700;line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{flex:none;width:32px;height:32px;border-radius:50%;background:var(--lav);color:var(--ink);display:grid;place-items:center;box-shadow:0 0 14px rgba(205,180,255,.55)}
.fav{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(13,10,20,.5);backdrop-filter:blur(12px);display:grid;place-items:center;color:#cfc6e2;z-index:2}
.fav[aria-pressed="true"]{color:#ff7aa8}
.kind{position:absolute;top:10px;left:10px;z-index:2}
.empty{grid-column:span 2;text-align:center;color:var(--muted);padding:40px 10px;border:1px dashed var(--line);border-radius:18px;font-size:14px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));display:flex;justify-content:space-around;align-items:center;padding:8px;border-radius:26px;background:rgba(21,18,30,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(205,180,255,.14);z-index:5}
.tab{border:0;background:none;color:#8d84a3;min-width:64px;height:48px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 10.5px var(--f)}
.tab[aria-pressed="true"]{color:var(--lav);filter:drop-shadow(0 0 8px rgba(205,180,255,.6))}
/* studio */
#studio{position:fixed;inset:0;background:#000;z-index:10}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;pointer-events:none;transition:opacity .3s}
.top>*{pointer-events:auto}
.iconbtn{flex:none;width:42px;height:42px;border-radius:14px;border:1px solid rgba(205,180,255,.18);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;place-items:center;color:#fff}
.stitle{min-width:0;flex:1}
.stitle h1{margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 10px #000}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(700px,calc(100% - 24px));background:rgba(21,18,30,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(157,78,221,.35);box-shadow:0 0 30px rgba(157,78,221,.18),inset 0 1px 0 rgba(255,179,107,.18);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:9px;transition:opacity .3s,transform .3s}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.scroll{overflow-x:auto;scrollbar-width:none;padding:2px}
.scroll::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid rgba(205,180,255,.18);background:var(--surface);color:#d9d3e6;font:600 13px var(--f);padding:7px 14px;border-radius:999px;transition:.2s;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--lav);color:var(--ink);border-color:var(--lav);box-shadow:0 0 16px rgba(205,180,255,.5)}
.pill.sh{width:36px;height:34px;padding:0;font-size:16px}
.bud{flex:none;width:46px;height:46px;border-radius:15px;border:1.5px solid rgba(205,180,255,.16);background:#15121E no-repeat center 35%/auto 125%;opacity:.55;transition:.2s;padding:0}
.bud[aria-pressed="true"]{opacity:1;border-color:var(--c);box-shadow:0 0 14px var(--c),inset 0 0 12px rgba(255,255,255,.06)}
.sw{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.5)}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);flex:none;width:62px}
.abtn{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:12px;border:1px solid rgba(205,180,255,.2);background:var(--surface);font:600 13px var(--f);color:#e9e4f4;white-space:nowrap}
.abtn.on{background:var(--lav);color:var(--ink);border-color:var(--lav);box-shadow:0 0 16px rgba(205,180,255,.5)}
.abtn input{display:none}
#spec{flex:1;min-width:50px;height:38px;border-radius:10px;background:#0b0912;border:1px solid rgba(255,255,255,.05)}
.hint{font-size:11.5px;color:var(--muted);text-align:center}
.vsep{flex:none;width:1px;height:24px;background:rgba(255,255,255,.1)}
#studio.bare .top,#studio.bare .dock{opacity:0;pointer-events:none}
#studio.bare .dock{transform:translate(-50%,20px)}
#showUI{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));opacity:.22}
#showUI:hover{opacity:.9}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:50;max-width:calc(100% - 32px);text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
#toast.show{opacity:1}
@media (max-width:520px){.lbl{display:none}.abtn{padding:0 10px}.abtn .t{display:none}.top{flex-wrap:wrap}.badges{order:5;width:100%;justify-content:flex-start;padding-left:52px}.badges .hm{display:none}}
</style>

<div id="home">
  <div class="col">
    <div class="head">
      <div class="brand">Pulsify</div>
      <button class="pill" id="installBtn" hidden style="margin-left:auto;margin-right:8px">Install app</button><span class="badge"><span class="dot"></span><span id="hsAudio">AMOLED • Audio Idle</span></span>
    </div>
    <label class="search" for="q">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>

    <button class="tab" id="tabCat" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.2"/></svg>Categories</button>

</div>

  <canvas id="stage"></canvas>
  <div class="top">

</div>
<div id="toast" role="status"></div>

<script>
"use strict";

"use strict";
const TAU=Math.PI*2, rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
const SPR={};
function sprite(col){if(SPR[col])return SPR[col];const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.12,hexA(col,1));gr.addColorStop(.4,hexA(col,.35));gr.addColorStop(1,hexA(col,0));g.fillStyle=gr;g.fillRect(0,0,64,64);return SPR[col]=c}
function glow(ctx,col,x,y,s,a=1){ctx.globalAlpha=a;ctx.drawImage(sprite(col),x-s,y-s,s*2,s*2);ctx.globalAlpha=1}

/* ================= AUDIO ENGINE ================= */
const AE={ctx:null,an:null,master:null,fd:null,mode:'none',bass:0,mid:0,treble:0,level:0,beat:false,bpm:0,active:false,
  ema:0,last:0,iv:[],pk:[.2,.2,.2],raw:[0,0,0],el:null,elSrc:null,mic:null,beatPhase:0,
  init(){if(this.ctx)return;const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();
    this.an=this.ctx.createAnalyser();this.an.fftSize=2048;this.an.smoothingTimeConstant=.55;
    this.master=this.ctx.createGain();this.master.gain.value=.85;this.master.connect(this.ctx.destination);this.master.connect(this.an);
    const z=this.ctx.createGain();z.gain.value=0;this.an.connect(z);z.connect(this.ctx.destination);
    this.fd=new Uint8Array(this.an.frequencyBinCount)},
  band(lo,hi){const hz=this.ctx.sampleRate/this.an.fftSize;let a=Math.max(1,Math.floor(lo/hz)),b=Math.min(this.fd.length-1,Math.ceil(hi/hz)),s=0;for(let i=a;i<=b;i++)s+=this.fd[i];return s/((b-a+1)*255)},
  update(dt,now){
    this.beat=false;
    if(!this.ctx||this.mode==='none'){this.bass*=.9;this.mid*=.9;this.treble*=.9;this.level*=.9;this.active=false;if(this.fd)this.fd.fill(0);return}
    this.active=true;this.an.getByteFrequencyData(this.fd);
    const raw=[this.band(20,250),this.band(250,4000),this.band(4000,16000)];
    const k=Math.pow(.997,dt*60);
    const nb=raw.map((v,i)=>{this.pk[i]=Math.max(v,this.pk[i]*k,.06);return clamp(Math.pow(v/this.pk[i],1.6),0,1)});
    this.bass=lerp(this.bass,nb[0],.55);this.mid=lerp(this.mid,nb[1],.4);this.treble=lerp(this.treble,nb[2],.5);this.level=(this.bass+this.mid+this.treble)/3;
    const e=raw[0];
    if(e>this.ema*1.15&&nb[0]>.55&&now-this.last>.24){this.beat=true;const d=now-this.last;if(d<1.2){this.iv.push(d);if(this.iv.length>8)this.iv.shift()}this.last=now}
    this.ema=lerp(this.ema,e,.08);
    if(this.mode==='synth')this.bpm=SY.bpm;else if(this.iv.length>2){const s=[...this.iv].sort((a,b)=>a-b);this.bpm=clamp(60/s[s.length>>1],70,180)}else this.bpm=120;

/* ================= PHOTO SCENES (Flow stills + code lighting) ================= */
class PhotoScene extends Scene{
  constructor(pv,src,focus){super(pv);this.img=img(src);this.focus=focus||[.5,.5];this.zoom=1;this.iw=900;this.ih=1612;this.s=1;this.ox=0;this.oy=0}
  layout(){const w=this.w,h=this.h;if(ready(this.img)){this.iw=this.img.naturalWidth;this.ih=this.img.naturalHeight}const iw=this.iw,ih=this.ih;
    let s=(w/h>iw/ih*1.3)?h/ih*1.08:Math.max(w/iw,h/ih);s*=this.zoom;const dw=iw*s,dh=ih*s;let ox=w/2-this.focus[0]*dw,oy=h/2-this.focus[1]*dh;
    if(dw>=w)ox=clamp(ox,w-dw,0);else ox=(w-dw)/2;if(dh>=h)oy=clamp(oy,h-dh,0);else oy=(h-dh)/2;this.s=s;this.ox=ox;this.oy=oy;this.sc=dw/900}
  P(u,v){return[this.ox+u*this.iw*this.s,this.oy+v*this.ih*this.s]}
  inv(x,y){return[(x-this.ox)/(this.iw*this.s),(y-this.oy)/(this.ih*this.s)]}
  drawImg(ctx,dx=0,dy=0){if(!ready(this.img))return false;ctx.drawImage(this.img,this.ox+dx,this.oy+dy,this.iw*this.s,this.ih*this.s);return true}
}

/* ---- Solar Core: Flow sun photo + corona, prominences, flares ---- */

  constructor(pv){super(pv,'media/sun.jpg',[.5,.5]);this.rot=0;this.rv=0;this.proms=[]}
  layout(){super.layout();const d=.432*2*this.iw*this.s,m=Math.min(this.w,this.h)*.9;if(d>m){const k=m/d;this.s*=k;this.sc*=k;const dw=this.iw*this.s,dh=this.ih*this.s;this.ox=this.w/2-dw/2;this.oy=this.h*.47-dh*.499}}
  geom(){const[cx,cy]=this.P(.5,.499);return{cx,cy,R:.432*this.iw*this.s}}
  flare(ang,pw){const{cx,cy,R}=this.geom(),x=cx+Math.cos(ang)*R,y=cy+Math.sin(ang)*R,cols=['#FFBE0B','#FB5607','#E0115F','#FFE29A'];
    for(let i=0;i<(this.preview?25:120)*pw;i++){const a=ang+rnd(-.35,.35),s=rnd(60,440)*pw*(this.preview?.5:1),l=rnd(1,2.4);this.parts.add({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:l,max:l,size:rnd(1.2,3.6),col:cols[(Math.random()*4)|0],drag:.975})}
    this.proms.push({a:ang,life:2.4,max:2.4,h:R*rnd(.08,.2)})}
  down(p){p.sx=p.x;p.sy=p.y;p.lx=p.x;p.ly=p.y;const{cx,cy,R}=this.geom();if(Math.hypot(p.x-cx,p.y-cy)<R*1.1)this.flare(Math.atan2(p.y-cy,p.x-cx),1.2)}
  move(p){this.rv+=(p.x-p.lx)*.0012;p.lx=p.x;p.ly=p.y}
  update(dt,A){this.t+=dt;this.A=A;this.rot+=(.006+this.rv)*dt*6;this.rv*=Math.pow(.15,dt);
    if(A.beat)this.flare(rnd(TAU),.55+A.bass*.6);
    if(Math.random()<dt*(3+(A.active?A.treble*10:0))){const{cx,cy,R}=this.geom(),a=rnd(TAU);this.parts.add({x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R,vx:Math.cos(a)*rnd(10,50),vy:Math.sin(a)*rnd(10,50),life:2,max:2,size:rnd(1,2.4),col:Math.random()<.5?'#FB5607':'#FFBE0B',drag:.99})}

    ctx.globalCompositeOperation='lighter';const cr=R*(1.5+bass*.6);let g=ctx.createRadialGradient(cx,cy,R*.92,cx,cy,cr);g.addColorStop(0,'rgba(255,170,30,.5)');g.addColorStop(.3,'rgba(251,86,7,.18)');g.addColorStop(.7,'rgba(200,20,60,.05)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(cx-cr,cy-cr,cr*2,cr*2);
    ctx.save();ctx.translate(cx,cy);for(let i=0;i<30;i++){const a=i/30*TAU+this.t*.03,l=R*(1.1+.5*vnoise(i*1.7,this.t*.7,0)+(A.active?A.treble*.35:0));ctx.fillStyle='rgba(255,160,40,.06)';ctx.beginPath();ctx.moveTo(Math.cos(a-.04)*R,Math.sin(a-.04)*R);ctx.lineTo(Math.cos(a)*l,Math.sin(a)*l);ctx.lineTo(Math.cos(a+.04)*R,Math.sin(a+.04)*R);ctx.fill()}ctx.restore();

    ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';for(const pr of this.proms){const k=1-pr.life/pr.max,gr=Math.sin(Math.min(1,k*1.6)*Math.PI/2),fade=Math.min(1,pr.life/.8)*Math.min(1,k*4),a0=pr.a-.06,a1=pr.a+.06,h=R+pr.h*gr*2.2;

    this.parts.draw(ctx)}

const spec=$('#spec'),spx=spec.getContext('2d');

  spx.clearRect(0,0,W,H);const n=Math.max(12,Math.floor(r.width/7)),bw=W/n,fd=AE.fd,g=spx.createLinearGradient(0,H,0,0);g.addColorStop(0,'#9D4EDD');g.addColorStop(.6,'#CDB4FF');g.addColorStop(1,'#FFB36B');spx.fillStyle=g;
  for(let i=0;i<n;i++){let v=0;if(fd&&AE.active){const a=Math.floor(Math.pow(fd.length*.75,i/n)),b=Math.max(a+1,Math.floor(Math.pow(fd.length*.75,(i+1)/n)));for(let k=a;k<b;k++)v=Math.max(v,fd[k]);v/=255}else v=.04+.03*Math.sin(performance.now()/400+i*.5);
    const h=Math.max(2*dpr,v*(H-4*dpr));spx.globalAlpha=.55+v*.45;spx.fillRect(i*bw+dpr,H-2*dpr-h,bw-2*dpr,h)}spx.globalAlpha=1}
const bc=document.createElement('canvas');bc.width=48;bc.height=96;const bcx=bc.getContext('2d',{willReadFrequently:true});let bT=0;

let last=performance.now(),fps=60,ft=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;AE.update(dt,t);fps=lerp(fps,1/Math.max(dt,.001),.05);ft+=dt;
  if(view==='studio'&&scene){const w=innerWidth,h=innerHeight;scene.update(dt,AE);fx.update(dt,AE,w,h);sctx.setTransform(dpr,0,0,dpr,0,0);sctx.globalAlpha=1;sctx.globalCompositeOperation='source-over';sctx.fillStyle='#000';sctx.fillRect(0,0,w,h);scene.draw(sctx);fx.draw(sctx,AE);drawSpec();
    if(scene.variants&&scene.variant!==scene._lv){scene._lv=scene.variant;syncPills()}bT+=dt;if(bT>1){bT=0;blackMeter()}}
  else if(view==='home'){const A=AE.active?AE:fakeA(t);
    for(const P of[...FEATS,...CATALOG.map(c=>previews[c.id])]){const it=P.it;if(P.el.hidden)continue;const r=P.el.getBoundingClientRect();if(r.bottom<-50||r.top>innerHeight+50)continue;const w=Math.round(r.width),h=Math.round(r.height);if(!w||!h)continue;
      if(!P.sc){P.sc=it.make(true)}if(w!==P.w||h!==P.h){P.w=w;P.h=h;P.cv.width=w;P.cv.height=h;P.sc.resize(w,h)}
      P.sc.update(dt,A);P.ctx.setTransform(1,0,0,1,0,0);P.ctx.globalAlpha=1;P.ctx.globalCompositeOperation='source-over';P.ctx.fillStyle='#000';P.ctx.fillRect(0,0,w,h);P.sc.draw(P.ctx)}}
  if(ft>.5){ft=0;$('#bFps').textContent=Math.min(60,Math.round(fps))+' FPS'}
  requestAnimationFrame(frame)}
audioUI();requestAnimationFrame(frame);

</script>
